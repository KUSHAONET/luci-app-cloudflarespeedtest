<%+cbi/valueheader%>
<input type="checkbox" id="checkbox1" checked><%:自动刷新%></input>
<textarea id="logview" class="cbi-input-textarea" 
    style="width: 100%; font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-all; background-color: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; line-height: 1.4;" 
    rows="50" readonly="readonly"></textarea>

<script type="text/javascript">
    // 后端获取日志的URL
    const LOG_URL = '<%=luci.dispatcher.build_url("admin", "services", "cloudflarespeedtest","getlog")%>';
    const logview = document.getElementById('logview');

    /**
     * 格式化原始日志字符串的函数
     */
    function formatLog(rawLog) {
        if (!rawLog) {
            return '【系统提示】正在等待日志生成...';
        }

        let formatted = rawLog;

        // 1. 在“开始下载测速”前强制换行
        formatted = formatted.replace(/([^\n])(\s*(\x1b\[\d+m)?开始下载测速)/g, '$1\n$2');

        // 2. 在测速结果表格标题“IP 地址”前强制换行
        formatted = formatted.replace(/([^\n])(\s*(\x1b\[\d+m)?IP 地址)/g, '$1\n$2');

        // 3. 处理进度条：在每一个新的进度更新点前插入换行符
        formatted = formatted.replace(/(\d+\s\/\s\d+\s\[)/g, '\n$1');

        // 4. 清理所有 ANSI 转义序列
        formatted = formatted.replace(/\x1b\[[0-9;]*[mGKH]/g, '');

        // 5. 统一处理换行符并分割成行数组
        const lines = formatted.split(/\r?\n/);

        // 6. 清理每行多余空格并过滤空行
        const processedLines = lines
            .map(line => line.trim())
            .filter(line => line.length > 0);

        // 7. 性能保护：防止日志堆积过大
        if (processedLines.length > 5000) {
            return "......（日志过长，已自动截取末尾部分）......\n" + processedLines.slice(-5000).join('\n');
        }

        return processedLines.join('\n');
    }

    /**
     * 执行 XHR 请求获取日志
     */
    function getlog() {
        XHR.get(LOG_URL, null, function(x, data) {
            if (data && typeof data.log === 'string') {
                const cleanText = formatLog(data.log);
                
                if (logview.value !== cleanText) {
                    logview.value = cleanText;
                    
                    // 自动滚动到底部
                    if (document.getElementById("checkbox1").checked) {
                        logview.scrollTop = logview.scrollHeight;
                    }
                }
            } else if (data && data.running === false && (!data.log || data.log === "")) {
                logview.value = "【系统提示】测速任务未运行。";
            }
        });
    }

    // 初始加载
    getlog();

    // 定时刷新
    setInterval(() => {
        if (document.getElementById("checkbox1").checked === true) {
            getlog();
        }
    }, 2000);
</script>
<%+cbi/valuefooter%>
